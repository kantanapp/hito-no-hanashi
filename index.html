<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人の話をよく聞いて</title>
<meta name="description" content="お母さんのおねがいを よく聞いて おぼえ、おちてくる しなものを タップして 買い物する おつかいゲーム。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffd400">
<!-- SNSで共有したときの見え方（OGP） -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="みみより しょうてんがい">
<meta property="og:title" content="人の話をよく聞いて">
<meta property="og:description" content="おかあさんの おねがいを よく聞いて おぼえる、かぞくみんなの おつかいゲーム。">
<meta property="og:url" content="https://kantanapp.github.io/hito-no-hanashi/">
<meta property="og:image" content="https://kantanapp.github.io/hito-no-hanashi/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="人の話をよく聞いて ― おかあさんと こどもが にっこり わらっている タイトル画像">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Potta+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* ページの土台（余白ゼロ・hidden 属性・ノッチの安全域） */
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: スマホ縦の1画面。上=おかあさんの声、中=しなものが降る売り場、下=カゴとレジ。結果はレシート1枚で答え合わせ。 */
:root{
  --pop:#ffd400;        /* 商店街のPOPの黄 */
  --pop-light:#ffe766;  /* ハッピーエンドの光 */
  --sale:#e3002c;       /* 値札の赤 */
  --on-sale:#ffffff;
  --ink:#231f1c;
  --ink-soft:#655d55;
  --paper:#fffdf6;      /* ふきだし・レシート */
  --floor:#e7f0ec;      /* スーパーの床 */
  --line:#cbd8d2;
  --floor-yao:#f1efd9;  /* やおやの木箱 */
  --line-yao:#dcd6b0;
  --floor-bank:#e4e8f2; /* ぎんこうの床 */
  --line-bank:#c9d0e0;
  --basket:#0d8459;     /* 買い物カゴの緑 */
  --bill:#e3ecd0;
  --coin:#e1e4e8;
  --coin-bronze:#dba56c;
  --veil:rgba(35,31,28,.88);
  --phone:#14171c;      /* スマホ本体 */
  --phone-top:#2a3742;
  --phone-edge:#5b6672;
  --on-phone:#fffdf6;
  --phone-soft:#b6c0ca;
  --answer:#1fb866;     /* 応答ボタンの緑 */
  --f-display:"Potta One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-receipt:"DotGothic16","Osaka-Mono","MS Gothic",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--pop);color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:500;line-height:1.6;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
p,h1,h2{margin:0}
button{font:inherit;color:inherit}

.app{height:100%;max-width:460px;margin-inline:auto;padding-inline:16px;padding-block:14px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.scroll{overflow-y:auto}

/* ボタン */
.btn{font-family:var(--f-display);font-size:1.15rem;line-height:1.3;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);padding:.7em 1em;box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-sale{background:var(--sale);color:var(--on-sale)}
.btn-go{background:var(--basket);color:var(--on-sale)}
.btn-small{font-family:var(--f-body);font-weight:700;font-size:.85rem;padding:.4em .8em;border-width:2px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* タイトル */
.shop{align-self:flex-start;background:var(--sale);color:var(--on-sale);font-weight:900;font-size:.8rem;letter-spacing:.08em;padding:.2em .8em;border-radius:4px;transform:rotate(-2deg)}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,14vw,3.9rem);line-height:1.12;color:var(--sale);-webkit-text-stroke:7px var(--paper);paint-order:stroke fill;filter:drop-shadow(0 4px 0 var(--ink));transform:rotate(-3deg);transform-origin:left center;margin-block:2px 6px;text-wrap:balance}
.says{display:flex;gap:12px;align-items:flex-start}
.mom{flex:none;width:64px;height:64px}
.mom-big{width:84px;height:84px}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:.6em .9em;font-weight:700}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;width:16px;height:16px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.levels{display:flex;flex-direction:column;gap:12px}
.level{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:baseline;text-align:left;font-family:var(--f-body);padding:.55em .9em}
.level-name{font-family:var(--f-display);font-size:1.35rem}
.level-stars{color:var(--sale);font-size:1rem;letter-spacing:.1em}
.level-place{grid-column:1/-1;font-size:.95rem;font-weight:900}
.level-rule{font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.level-wins{font-size:.78rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.title-foot{display:flex;justify-content:flex-end;gap:10px;padding-bottom:6px}

/* おねがい */
.mission{justify-content:center}
.mission .bubble{font-size:1.4rem;line-height:1.75;padding:.7em .9em}
.note{font-size:.88rem;font-weight:700}
.label{font-weight:900;font-size:.82rem;letter-spacing:.06em}
.timer{display:flex;flex-direction:column;gap:4px;font-weight:900;font-size:.95rem;font-variant-numeric:tabular-nums}
.timer-track{height:12px;border:2px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.timer-bar{height:100%;background:var(--sale);transform-origin:left center}

/* あそぶ */
.hud{display:flex;align-items:center;gap:10px}
.pill{background:var(--ink);color:var(--pop);font-family:var(--f-display);font-size:.95rem;padding:.15em .8em;border-radius:99px;white-space:nowrap}
.hud-rule{flex:1;min-width:0;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.field{position:relative;flex:1;min-height:220px;overflow:hidden;border:3px solid var(--ink);border-radius:16px;touch-action:manipulation;
  background:repeating-linear-gradient(90deg,transparent 0 47px,var(--line) 47px 48px),repeating-linear-gradient(0deg,transparent 0 47px,var(--line) 47px 48px),var(--floor)}
.field[data-place="yao"]{--floor:var(--floor-yao);--line:var(--line-yao)}
.field[data-place="bank"]{--floor:var(--floor-bank);--line:var(--line-bank)}
.item{position:absolute;left:0;top:0;width:136px;height:136px;font-size:16px;display:grid;place-items:center;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);will-change:transform;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.item.bill{width:184px;height:104px;border-radius:14px;background:var(--bill)}
.item.coin{width:124px;height:124px;background:var(--coin)}
.item.coin.bronze{background:var(--coin-bronze)}
.yen{font-weight:900;font-size:2.5em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.yen small{font-size:.6em;margin-left:1px}
.coin .yen{font-size:2.1em}
.g{font-size:4.75em;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.g svg{display:block;height:1.16em;width:auto}
.dock{display:flex;gap:10px;align-items:stretch}
.basket{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;background:var(--paper);border:3px solid var(--basket);border-radius:14px;padding:6px 10px;min-height:76px}
.basket-head{display:flex;justify-content:space-between;gap:8px;font-size:.74rem;font-weight:900;color:var(--basket)}
.basket-items{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:84px;overflow-y:auto}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--floor);border:2px solid var(--ink);border-radius:99px;padding:1px 9px 1px 5px;font-weight:900;font-variant-numeric:tabular-nums}
button.chip{cursor:pointer;box-shadow:0 2px 0 var(--ink)}
button.chip:active{transform:translateY(2px);box-shadow:none}
.chip .g{font-size:28px}
.chip .g svg{height:32px}
.empty{font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.register{flex:none;align-self:stretch;min-width:92px;font-size:1.3rem}
.register.long{font-size:1.05rem}

/* でんわ・かくにん */
.call{position:fixed;inset:0;z-index:10;background:var(--veil);display:grid;place-items:center;padding:16px}
.call-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;background:var(--pop);border:3px solid var(--ink);border-radius:20px;padding:18px 16px}
.call-step{display:flex;flex-direction:column;gap:14px}
.ask-title{font-family:var(--f-display);font-size:1.35rem;line-height:1.4;text-wrap:balance}

/* スマホ：ちゃくしん → つうわ */
.handset{position:relative;width:min(330px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(170deg,var(--phone-top),var(--phone) 70%);color:var(--on-phone);border:4px solid var(--ink);outline:2px solid var(--phone-edge);border-radius:40px;padding:38px 18px 24px}
.handset.buzz{animation:buzz 1.3s linear infinite}
.handset :focus-visible{outline-color:var(--pop)}
.handset-ear{position:absolute;top:14px;left:50%;width:64px;height:8px;margin-left:-32px;border-radius:99px;background:var(--ink)}
.ringing{align-items:center;justify-content:space-between;gap:26px;min-height:min(440px,70vh)}
.call-where{text-align:center;font-size:.88rem;font-weight:700;color:var(--phone-soft)}
.caller{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.caller-pic{position:relative;display:grid;place-items:center;width:132px;height:132px;margin-bottom:12px}
.caller-pic .mom{position:relative;width:104px;height:104px;background:var(--pop);border:3px solid var(--on-phone);border-radius:50%}
.ripple{position:absolute;inset:12px;border-radius:50%;border:3px solid var(--answer);animation:ripple 1.3s ease-out infinite}
.ripple.r2{animation-delay:.45s}
.caller-name{font-family:var(--f-display);font-size:2rem;line-height:1.2}
.caller-sub{font-size:.9rem;font-weight:700;color:var(--phone-soft);font-variant-numeric:tabular-nums}
.answer{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--on-phone);font-family:var(--f-display);font-size:1.1rem;cursor:pointer;touch-action:manipulation}
.answer-dot{display:grid;place-items:center;width:86px;height:86px;border-radius:50%;background:var(--answer);border:3px solid var(--on-phone);animation:hop .65s ease-in-out infinite alternate}
.answer-dot svg{width:42px;height:42px;fill:var(--on-phone)}
.talking{gap:14px}
.talk-head{display:flex;align-items:center;gap:12px}
.talk-head .mom{width:56px;height:56px;background:var(--pop);border:2px solid var(--on-phone);border-radius:50%}
.talk-head .caller-name{font-size:1.3rem}
.phone-bubble{flex:none;color:var(--ink);font-size:1.2rem;line-height:1.7}
.phone-bubble::before{left:22px;top:-10px;transform:rotate(135deg)}
.handset .timer-track{border-color:var(--on-phone);background:transparent}
.call-note{font-size:.85rem;font-weight:700;color:var(--phone-soft)}
.hangup{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--sale);color:var(--on-sale);border:3px solid var(--on-phone);border-radius:99px;font-family:var(--f-display);font-size:1.15rem;padding:.6em 1em;cursor:pointer;touch-action:manipulation}
.hangup svg{width:26px;height:26px;fill:currentColor;transform:rotate(135deg)}
.ghost{visibility:hidden}
@keyframes buzz{0%,46%,100%{transform:translateX(0) rotate(0)}4%,12%,20%,28%,36%{transform:translateX(-5px) rotate(-1.2deg)}8%,16%,24%,32%,40%{transform:translateX(5px) rotate(1.2deg)}}
@keyframes ripple{from{transform:scale(.85);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes hop{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-8px) rotate(8deg)}}

/* けっか */
.stamp{font-family:var(--f-display);font-size:clamp(1.5rem,7.6vw,2.1rem);line-height:1.25;text-align:center;padding:.25em .7em;border:5px solid currentColor;border-radius:14px;background:var(--paper);transform:rotate(-4deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.verdict{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.hanamaru{flex:none;width:96px;height:96px;transform:rotate(8deg)}
.hanamaru path{fill:none;stroke:var(--sale);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s .3s ease-out backwards}
.streak{align-self:center;background:var(--ink);color:var(--pop);font-family:var(--f-display);font-size:1rem;padding:.2em 1em;border-radius:99px;text-align:center}
.praise .bubble{font-size:1.25rem;line-height:1.7;border-color:var(--sale)}
.praise .bubble::before{border-color:var(--sale)}
.praise .mom{animation:cheer .42s ease-in-out 6 alternate}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* ハッピーエンド：画面いっぱいの おかあさんと こども */
.ending{position:relative;gap:10px;justify-content:center}
.ending::before{content:"";position:fixed;inset:0;z-index:0;background:repeating-conic-gradient(from -5deg at 50% 64%,var(--pop) 0 10deg,var(--pop-light) 10deg 20deg)}
.ending>*{position:relative;z-index:1}
.end-bubble{flex:none;font-size:1.2rem;line-height:1.6;border-color:var(--sale)}
.end-bubble::before{left:24%;top:auto;bottom:-10px;border-color:var(--sale);transform:rotate(-45deg)}
.end-stage{flex:1 1 0;min-height:320px;max-height:calc(min(100vw,460px)*1.36)}
.end-scene{position:absolute;inset:-36px 0 0 0}
.end-scene svg{display:block;width:100%;height:100%}
.end-actions{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.end-row{display:flex;gap:10px}
.end-row .btn{flex:1;background:var(--paper)}
.mama,.kid,.twinkle{transform-box:fill-box}
.mama{transform-origin:50% 100%;animation:sway 1.1s ease-in-out infinite alternate}
.kid{animation:bob .45s ease-in-out infinite alternate}
.twinkle{transform-origin:50% 50%;animation:twinkle .9s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes twinkle{from{transform:scale(.7) rotate(-8deg)}to{transform:scale(1.1) rotate(8deg)}}
@keyframes cheer{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-9px) rotate(6deg)}}
.stamp.good{color:var(--basket)}
.stamp.bad{color:var(--sale)}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.receipt{position:relative;background:var(--paper);font-family:var(--f-receipt);font-size:.95rem;line-height:1.5;padding:14px 14px 10px;margin-bottom:8px;box-shadow:0 2px 0 var(--ink)}
.receipt::after{content:"";position:absolute;left:0;right:0;top:100%;height:6px;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) 0 0/12px 12px repeat-x,linear-gradient(225deg,var(--paper) 25%,transparent 25%) 0 0/12px 12px repeat-x}
.receipt-shop{text-align:center;font-size:1.1rem;letter-spacing:.1em}
.receipt-meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.receipt hr{border:0;border-top:2px dashed var(--ink);margin:8px 0}
.receipt table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.receipt th{font-weight:400;font-size:.78rem;color:var(--ink-soft);text-align:right;padding:0 0 4px}
.receipt th:first-child,.receipt td:first-child{text-align:left}
.receipt td{text-align:right;padding:2px 0 2px 6px;vertical-align:top}
.receipt td:first-child{padding-left:0}
.receipt td.mark{width:2em;font-size:1.15rem}
.receipt tr.ng td{color:var(--sale)}
.receipt tr.ok td.mark{color:var(--basket)}
.receipt tr.sec td{text-align:center;color:var(--ink-soft);font-size:.82rem;padding-top:6px}
.receipt-total{display:flex;justify-content:space-between}
.receipt-bye{text-align:center;font-size:.8rem;color:var(--ink-soft);margin-top:6px}
.said{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:700;font-size:.92rem}
.said ol{margin:4px 0 0;padding-left:1.4em}
.actions{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}

@media (prefers-reduced-motion:reduce){.handset.buzz,.ripple,.answer-dot,.stamp,.hanamaru path,.praise .mom,.mama,.kid,.twinkle{animation:none}}
</style>
</head>
<body>
<div class="app">

  <section id="scr-title" class="screen scroll">
    <p class="shop">みみより しょうてんがい の おつかい</p>
    <h1 class="logo">人の話を<br>よく聞いて</h1>
    <div class="says">
      <span id="mom-title"></span>
      <p class="bubble">お母さんのおねがいを よく聞いて、ちゃんとおぼえたら スタート。おちてくる しなものを タップして、ゲットして、レジへ。</p>
    </div>
    <div class="levels">
      <button type="button" class="btn level" id="lv-easy" data-level="easy">
        <span class="level-name">やさしい</span><span class="level-stars" aria-hidden="true">★☆☆</span>
        <span class="level-place">やおやで おつかい</span>
        <span class="level-rule">カゴが みえる・もどせる</span>
        <span class="level-wins" id="wins-easy"></span>
      </button>
      <button type="button" class="btn level" id="lv-normal" data-level="normal">
        <span class="level-name">ふつう</span><span class="level-stars" aria-hidden="true">★★☆</span>
        <span class="level-place">スーパーで おつかい</span>
        <span class="level-rule">カゴが みえる・もどせない・とちゅうで でんわ</span>
        <span class="level-wins" id="wins-normal"></span>
      </button>
      <button type="button" class="btn level" id="lv-hard" data-level="hard">
        <span class="level-name">むずかしい</span><span class="level-stars" aria-hidden="true">★★★</span>
        <span class="level-place">やおや → スーパー → ぎんこう</span>
        <span class="level-rule">カゴが みえない・もどせない・よむ じかんに かぎり</span>
        <span class="level-wins" id="wins-hard"></span>
      </button>
    </div>
    <div class="title-foot"><button type="button" class="btn btn-small" id="btn-voice" aria-pressed="true">こえ：あり</button><button type="button" class="btn btn-small" id="btn-sound" aria-pressed="true">おと：あり</button></div>
  </section>

  <section id="scr-mission" class="screen scroll mission" hidden>
    <p class="label">おかあさんの おねがい（<span id="mission-level"></span>）</p>
    <div class="says">
      <span id="mom-mission"></span>
      <p class="bubble" id="mission-text"></p>
    </div>
    <div class="timer" id="mission-timer" hidden>
      <span id="mission-timer-label"></span>
      <div class="timer-track"><div class="timer-bar" id="mission-timer-bar"></div></div>
    </div>
    <p class="note" id="mission-note"></p>
    <button type="button" class="btn btn-sale" id="btn-start">おぼえた！ いってきます</button>

                  'apple','banana','orange','carrot','tomato','potato','onion','cucumber'];

const MONEY = {
  m10000:{v:10000,kind:'bill'}, m5000:{v:5000,kind:'bill'}, m1000:{v:1000,kind:'bill'},
  m500:{v:500,kind:'coin'}, m100:{v:100,kind:'coin'}, m50:{v:50,kind:'coin'}, m10:{v:10,kind:'coin bronze'}
};
const MONEY_MIX = {m1000:11, m100:13, m500:9, m5000:4, m10000:3, m50:5, m10:5};   // あわせて50まい

const PLACES = {
  yao:  {n:'やおや',   at:'やおやさん', go:'レジへ',   bag:'カゴ'},

const DECK = 50;

/* speed=落下(px/秒) gap=出現間隔(ミリ秒) see=カゴが見える undo=もどせる timed=読む時間に限り
   stages: kinds=たのまれる種類 max=1種類の最大数 avoid=「かわないで」の数 calls=買い物中の電話 */
const LEVELS = {
  easy:   {label:'やさしい',   speed:95,  gap:900, see:true,  undo:true,  timed:false,
           stages:[{type:'shop', place:'yao',   pool:YAO_EASY, kinds:2, max:3, avoid:1, calls:0}]},
  normal: {label:'ふつう',     speed:150, gap:680, see:true,  undo:false, timed:false,
           stages:[{type:'shop', place:'super', pool:SUPER,    kinds:3, max:4, avoid:1, calls:1}]},
  hard:   {label:'むずかしい', speed:205, gap:500, see:false, undo:false, timed:true,
           stages:[{type:'shop', place:'yao',   pool:YAO_ALL,  kinds:3, max:4, avoid:1, calls:0},
                   {type:'shop', place:'super', pool:SUPER,    kinds:4, max:5, avoid:2, calls:0},
                   {type:'bank', place:'bank'}]}
};

function shuffle(a, rnd){
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* 同じものが続かないようにならす */
function spread(a){
  for (let i = 1; i < a.length; i++) {
    if (a[i] !== a[i - 1]) continue;
    for (let j = i + 1; j < a.length; j++) {
      if (a[j] !== a[i - 1] && a[j] !== a[i + 1]) { [a[i], a[j]] = [a[j], a[i]]; break; }
    }
  }
  return a;
}
const qty = (id, n) => `${ITEMS[id].n}を ${n}${ITEMS[id].c}`;
const yen = v => v.toLocaleString('ja-JP') + '円';

function makeStage(cfg, idx, total, rnd){
  const at = PLACES[cfg.place].at;
  const head = idx === 0 ? '' : (idx === total - 1 ? 'もしもし？ さいごに ' : 'もしもし？ ついでに ');
  if (cfg.type === 'bank') {
    const amount = (12 + Math.floor(rnd() * 87)) * 100;            // 1,200〜9,800円
    return {type:'bank', place:cfg.place, amount, secs:6,
            speech:`${head}${at}で ${yen(amount)} おろしてきて。ぴったりでね。`};
  }
  const ids = shuffle(cfg.pool.slice(), rnd);
  const order = ids.slice(0, cfg.kinds);
  const avoid = ids.slice(cfg.kinds, cfg.kinds + cfg.avoid);
  const spare = ids.slice(cfg.kinds + cfg.avoid);
  const want = {};
  order.forEach(id => { want[id] = 1 + Math.floor(rnd() * cfg.max); });

  const parts = order.map(id => qty(id, want[id]));
  const no = avoid.map(id => ITEMS[id].n).join('と ') + 'は かわないでね。';
  const speech = (idx === 0 && parts.length > 1 && rnd() < 0.5)
    ? `${at}に いってきて。${parts[0]}。${no} それと ${parts.slice(1).join('、')}。おねがいね。`
    : `${head}${at}で、${parts.join('、')} かってきて。${no}`;

  const calls = [], late = {};
  for (let i = 0; i < cfg.calls; i++) {
    const n = 1 + Math.floor(rnd() * 2);
    const add = rnd() < 0.5;
    const id = add ? spare[i] : order[Math.floor(rnd() * order.length)];
    calls.push({id, n, at:14 + Math.floor(rnd() * 6) + i * 12, text: add
      ? `もしもし？ ごめん、${ITEMS[id].n}も ${n}${ITEMS[id].c} おねがい！`
      : `もしもし？ ${ITEMS[id].n}、あと ${n}${ITEMS[id].c} ついかで おねがい！`});
    late[id] = (late[id] || 0) + n;
  }
  return {type:'shop', place:cfg.place, pool:cfg.pool, want, order, avoid, calls, late, speech,
          secs:4 + 2 * (cfg.kinds + cfg.avoid)};
}

function makeErrand(key, rnd = Math.random){
  const cfgs = LEVELS[key].stages;
  return {level:key, stages:cfgs.map((c, i) => makeStage(c, i, cfgs.length, rnd))};
}

/* 50品の山。たのまれた品は「数＋2」、かわないでは2つ、のこりは他の品を1つずつ。
   late（電話でふえる分）は後半にだけ入れる。 */
function buildDeck(pool, want, avoid, late, rnd = Math.random){
  const main = [], tail = [];
  Object.keys(want).forEach(id => { for (let i = 0; i < want[id] + 2; i++) main.push(id); });
  avoid.forEach(id => { if (!(id in want) && !(id in late)) main.push(id, id); });
  Object.keys(late).forEach(id => { for (let i = 0; i < late[id] + 2; i++) tail.push(id); });
  const used = new Set(Object.keys(want).concat(avoid, Object.keys(late)));
  const others = shuffle(pool.filter(id => !used.has(id)), rnd);
  for (let k = 0; main.length + tail.length < DECK; k++) main.push(others[k % others.length]);
  const deck = spread(shuffle(main, rnd));
  const half = Math.floor(DECK / 2);
  tail.forEach(id => { deck.splice(half + Math.floor(rnd() * (deck.length - half + 1)), 0, id); });
  return deck;
}

function bankDeck(rnd = Math.random){
  const a = [];
  Object.keys(MONEY_MIX).forEach(id => { for (let i = 0; i < MONEY_MIX[id]; i++) a.push(id); });
  return spread(shuffle(a, rnd));
}

function applyCall(want, call){
  const w = Object.assign({}, want);
  w[call.id] = (w[call.id] || 0) + call.n;
  return w;
}

function judge(want, basket){
  const extra = Object.keys(basket).filter(id => !(id in want) && basket[id] > 0);
  const rows = Object.keys(want).concat(extra).map(id => {
    const w = want[id] || 0, g = basket[id] || 0;
    return {id, want:w, got:g, ok:w === g};
  });
  return {ok: rows.every(r => r.ok), rows};
}

let AC = null, ringTimer = 0;
function audio(){
  if (save.mute) return null;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
function tone(freq, at, dur, type, vol){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type || 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  pick(){ tone(660, 0, .08); tone(990, .05, .1); },
  back(){ tone(520, 0, .08); tone(390, .06, .1); },

  },
  ring(){ for (let i = 0; i < 6; i++) tone(i % 2 ? 1175 : 932, i * .08, .07, 'square', .06); },
  good(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .22)); },
  bad(){ [392, 330, 262].forEach((f, i) => tone(f, i * .16, .28, 'sawtooth', .08)); }
};

function renderSound(){
  const b = $('btn-sound');
  b.textContent = save.mute ? 'おと：なし' : 'おと：あり';
  b.setAttribute('aria-pressed', String(!save.mute));
  const v = $('btn-voice');
  v.textContent = save.voice ? 'こえ：あり' : 'こえ：なし';
  v.setAttribute('aria-pressed', String(save.voice));
}

/* ---- おかあさんの こえ（スマホやパソコンに入っている 読み上げの声） ---- */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let jaVoice = null, voiceCount = 0;
let voiceState = 'off';          // off=しゃべっていない pending=しゃべりはじめ待ち on=しゃべっている
let voiceNow = null, voiceGuard = 0, voiceWaiters = [];
function loadVoices(){
  if (!synth) return;
  let vs = [];
  try { vs = synth.getVoices() || []; } catch (e) {}
  voiceCount = vs.length;
  const ja = vs.filter(v => /^ja/i.test(v.lang));
  const prefer = [/Kyoko/i, /O-?ren/i, /Nanami/i, /Haruka/i, /Sayaka/i, /Ayumi/i, /Google/i];
  jaVoice = null;
  for (const re of prefer) { jaVoice = ja.find(v => re.test(v.name)) || null; if (jaVoice) break; }
  jaVoice = jaVoice || ja[0] || null;
}
if (synth) {
  loadVoices();
  try { synth.addEventListener('voiceschanged', loadVoices); } catch (e) {}
}
const voiceUsable = () => !!synth && save.voice && !save.mute && (voiceCount === 0 || !!jaVoice);
function endVoice(){
  clearTimeout(voiceGuard); voiceGuard = 0;
  voiceState = 'off'; voiceNow = null;
  const w = voiceWaiters; voiceWaiters = [];
  w.forEach(f => f());
}
function stopSpeak(){
  clearTimeout(voiceGuard); voiceGuard = 0;
  voiceWaiters = []; voiceState = 'off'; voiceNow = null;
  if (synth) { try { synth.cancel(); } catch (e) {} }
}
function speak(text){
  stopSpeak();
  if (!voiceUsable()) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
    u.rate = 1; u.pitch = 1.15; u.volume = 1;
    u.onstart = () => {
      if (voiceNow !== u) return;
      voiceState = 'on';
      clearTimeout(voiceGuard);
      voiceGuard = setTimeout(endVoice, 2500 + text.length * 300);   // onend が来ない端末への保険
    };
    u.onend = u.onerror = () => { if (voiceNow === u) endVoice(); };
    voiceNow = u; voiceState = 'pending';
    voiceGuard = setTimeout(endVoice, 1500);                         // 声が出ない端末はここで あきらめる
    synth.speak(u);
  } catch (e) { voiceState = 'off'; voiceNow = null; }
}
/* しゃべりおわってから つぎへ */
function whenVoiceDone(cb){ if (voiceState === 'off') cb(); else voiceWaiters.push(cb); }

/* ---- よむ時間のカウントダウン ---- */
let tick = 0;
function stopCountdown(){ clearInterval(tick); tick = 0; }
/* はなしが おわるまでは、満タンのまま まつ（画面が がたつかないように先に出しておく） */
function waitTimer(on, box, label, bar){
  box.hidden = !on;
  label.textContent = 'はなしを きいてね…';
  bar.style.transform = 'scaleX(1)';
}
function countdown(secs, box, label, bar, done){
  stopCountdown();
  box.hidden = false;
  const total = secs * 1000, end = performance.now() + total;
  const step = () => {
    const left = Math.max(0, end - performance.now());
    label.textContent = `あと ${Math.ceil(left / 1000)}びょう`;
    bar.style.transform = `scaleX(${left / total})`;
    if (left <= 0) { stopCountdown(); done(); }
  };
  step(); tick = setInterval(step, 100);
}

/* ---- おかあさんの ことばを 1文字ずつ出す ---- */
let typeTimer = 0, typing = null;
function stopType(){ clearTimeout(typeTimer); typeTimer = 0; typing = null; }
function typeText(el, text, done){
  stopType();
  el.textContent = '';
  el.setAttribute('aria-label', text);
  const shown = document.createElement('span'), rest = document.createElement('span');
  shown.setAttribute('aria-hidden', 'true');
  rest.className = 'ghost'; rest.setAttribute('aria-hidden', 'true');   // ふきだしの大きさを先に確保
  rest.textContent = text;
  el.append(shown, rest);
  const chars = Array.from(text);
  let i = 0;
  const finish = () => { stopType(); shown.textContent = text; rest.textContent = ''; if (done) done(); };
  if (reduced) { finish(); return; }
  typing = {finish};
  const step = () => {
    if (i >= chars.length) { finish(); return; }
    const ch = chars[i++];
    shown.textContent += ch;
    rest.textContent = chars.slice(i).join('');
    const voiced = voiceState !== 'off';
    if (!voiced && !/\s/.test(ch) && i % 2) sfx.talk();
    typeTimer = setTimeout(step, /[。！？]/.test(ch) ? (voiced ? 460 : 380) : ch === '、' ? (voiced ? 300 : 220) : /\s/.test(ch) ? 30 : (voiced ? 118 : 62));
  };
  typeTimer = setTimeout(step, 350);
}
function skipType(){ if (typing) { typing.finish(); return true; } return false; }

let clockTimer = 0;
function startClock(){
  stopClock();
  const t0 = Date.now(), el = $('call-clock'), p = n => String(n).padStart(2, '0');
  const draw = () => { const s = Math.floor((Date.now() - t0) / 1000); el.textContent = `${p(Math.floor(s / 60))}:${p(s % 60)}`; };
  draw(); clockTimer = setInterval(draw, 1000);
}
function stopClock(){ clearInterval(clockTimer); clockTimer = 0; }

/* ---- ゲームのじょうたい ---- */
const S = {level:null, errand:null, stageIdx:0, stage:null, log:[], said:[],
           want:{}, basket:{}, picked:[], total:0, callsLeft:[], deck:[], deckPos:0, pass:1,
           items:[], running:false, last:0, spawnIn:0, prev:null, raf:0, call:null};
const field = $('field');
window.kiite = {makeErrand, buildDeck, bankDeck, applyCall, judge, LEVELS, ITEMS, MONEY, state:S};

function chooseLevel(key){ S.level = key; newErrand(); }

function newErrand(){
  stop();
  const L = LEVELS[S.level];
  S.errand = makeErrand(S.level);
  S.stageIdx = 0; S.log = []; S.said = [];
  const st = S.errand.stages[0];
  S.said.push(st.speech);
  $('mission-level').textContent = L.label;
  waitTimer(L.timed, $('mission-timer'), $('mission-timer-label'), $('mission-timer-bar'));
  $('mission-note').textContent = L.timed ? 'いいおわって じかんが くると、おねがいは きえて スタートします。' : 'スタートすると、この おねがいは きえます。';
  show('mission');
  $('btn-start').focus({preventScroll:true});
  speak(st.speech);
  typeText($('mission-text'), st.speech, () => whenVoiceDone(() => {
    if (L.timed) countdown(st.secs, $('mission-timer'), $('mission-timer-label'), $('mission-timer-bar'), startStage);
  }));
}

function startStage(){
  stopCountdown(); stopType(); stopSpeak();
  if (S.stageIdx === 0) track('level_start', {level_name:S.level});
  const L = LEVELS[S.level], st = S.stage = S.errand.stages[S.stageIdx], P = PLACES[st.place];
  S.basket = {}; S.picked = []; S.total = 0; S.pass = 1;
  if (st.type === 'shop') {
    S.want = Object.assign({}, st.want);
    S.callsLeft = st.calls.slice();
    S.deck = buildDeck(st.pool, st.want, st.avoid, st.late);
  } else {
    S.want = {}; S.callsLeft = [];
    S.deck = bankDeck();
  }
  S.deckPos = 0; S.spawnIn = 300; S.prev = null;
  clearField();
  field.dataset.place = st.place;
  $('hud-place').textContent = P.n;
  $('hud-level').textContent = L.label + (S.errand.stages.length > 1 ? ` ${S.stageIdx + 1}/${S.errand.stages.length}` : '');
  $('basket-name').textContent = P.bag;
  $('basket-hint').textContent = L.undo ? 'タップで もどせる' : '';
  const reg = $('btn-register');
  reg.textContent = P.go; reg.classList.toggle('long', P.go.length > 3);
  renderCount(); renderBasket();
  show('play');
  resume();
}

function renderCount(){ $('hud-count').textContent = `${Math.min(S.deckPos, S.deck.length)}/${S.deck.length}`; }

function resume(){
  if (S.running) return;
  S.running = true; S.last = performance.now();
  S.raf = requestAnimationFrame(frame);
}
function pause(){ S.running = false; cancelAnimationFrame(S.raf); }
function stop(){
  pause(); stopRing(); stopCountdown(); stopType(); stopClock(); stopSpeak(); stopConfetti();
  S.call = null;
  $('handset').classList.remove('buzz');
  $('call').hidden = true; $('ask').hidden = true;
}
function clearField(){ S.items.length = 0; field.textContent = ''; }

function frame(ts){
  if (!S.running) return;
  const L = LEVELS[S.level];
  const dt = Math.min(0.05, Math.max(0, (ts - S.last) / 1000)); S.last = ts;
  S.spawnIn -= dt * 1000;
  if (S.spawnIn <= 0 && S.deckPos < S.deck.length && spawn(L)) S.spawnIn = L.gap * (0.85 + Math.random() * 0.3);
  const h = field.clientHeight;
  for (let i = S.items.length - 1; i >= 0; i--) {
    const it = S.items[i];
    it.y += it.v * dt;
    if (it.y > h + 8) { it.gone = true; it.el.remove(); S.items.splice(i, 1); continue; }
    it.el.style.transform = `translate3d(${it.x}px,${it.y}px,0)`;
  }
  if (S.pass === 1 && S.callsLeft.length && S.deckPos >= S.callsLeft[0].at) { midCall(false); return; }
  if (S.deckPos >= S.deck.length && !S.items.length) { openAsk(); return; }
  S.raf = requestAnimationFrame(frame);
}

function spawn(L){
  const id = S.deck[S.deckPos];
  const money = MONEY[id];
  const w = field.clientWidth;
  const unit = Math.max(0.6, Math.min(1, (w - 14) / 272));           // せまい画面では 2つ並ぶ大きさまで ちぢめる
  const sw = Math.round((money ? (money.kind === 'bill' ? 184 : 124) : 136) * unit);   // はば
  const sh = Math.round((money ? (money.kind === 'bill' ? 104 : 124) : 136) * unit);   // たかさ
  const maxX = Math.max(0, w - sw);
  /* ひとつ前の品物とは 左右に分けて、かさならないようにする */
  const p = S.prev && !S.prev.it.gone ? S.prev : null;
  const clear = x => !p || x >= p.x + p.w + 6 || x + sw + 6 <= p.x;
  const jitter = Math.max(0, (w - sw - (p ? p.w : sw) - 6) / 2);
  const left = p ? (p.x + p.w / 2 > w / 2) : Math.random() < 0.5;
  let x = left ? Math.random() * jitter : maxX - Math.random() * jitter;
  if (!clear(x)) {
    if (p.it.y < 14) return false;            // 左右に分けられないときは、前の品物が通りすぎるまで待つ
    x = Math.random() * maxX;
  }
  S.deckPos++;
  const el = document.createElement('div');
  el.className = 'item' + (money ? ' ' + money.kind : '');
  el.style.width = sw + 'px'; el.style.height = sh + 'px'; el.style.fontSize = (16 * unit) + 'px';
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', money ? yen(money.v) : ITEMS[id].n);
  el.innerHTML = money ? moneyFace(id) : glyph(id);
  const it = {id, el, x, y:-(sh + 10), v:L.speed, gone:false};
  el.style.transform = `translate3d(${x}px,${it.y}px,0)`;
  el.addEventListener('pointerdown', e => { e.preventDefault(); collect(it); });
  field.appendChild(el);
  S.items.push(it);
  S.prev = {x, w:sw, it};
  renderCount();
  return true;
}

function collect(it){
  if (!S.running) return;
  const i = S.items.indexOf(it); if (i < 0) return;
  S.items.splice(i, 1); it.gone = true;
  if (MONEY[it.id]) S.total += MONEY[it.id].v;
  else {
    if (!(it.id in S.basket)) { S.basket[it.id] = 0; S.picked.push(it.id); }
    S.basket[it.id]++;
  }
  sfx.pick();
  if (reduced || !it.el.animate) { it.el.remove(); }
  else {
    const from = `translate3d(${it.x}px,${it.y}px,0)`;
    const to = `translate3d(${it.x}px,${field.clientHeight}px,0) scale(.3)`;
    it.el.style.pointerEvents = 'none';
    it.el.animate([{transform:from, opacity:1}, {transform:to, opacity:0}], {duration:200, easing:'ease-in'}).onfinish = () => it.el.remove();
    $('basket').animate([{transform:'scale(1)'}, {transform:'scale(1.04)'}, {transform:'scale(1)'}], {duration:180});
  }
  renderBasket();
}

function renderBasket(){
  const L = LEVELS[S.level], box = $('basket-items'), bank = S.stage.type === 'bank';
  if (!L.see) {
    box.innerHTML = `<span class="empty">${bank ? 'いくら とったかは みえないよ。かぞえておこう' : 'なかみは みえないよ。おぼえておこう'}</span>`;
    return;
  }
  if (bank) { box.innerHTML = `<span class="chip">いま ${yen(S.total)}</span>`; return; }
  const ids = S.picked.filter(id => S.basket[id] > 0);
  if (!ids.length) { box.innerHTML = '<span class="empty">まだ からっぽ</span>'; return; }
  box.innerHTML = ids.map(id => {
    const inner = `${glyph(id)}<span>×${S.basket[id]}</span>`;
    return L.undo
      ? `<button type="button" class="chip" data-id="${id}" aria-label="${ITEMS[id].n}を 1${ITEMS[id].c} もどす（いま ${S.basket[id]}${ITEMS[id].c}）">${inner}</button>`
      : `<span class="chip" role="img" aria-label="${ITEMS[id].n} ${S.basket[id]}${ITEMS[id].c}">${inner}</span>`;
  }).join('');
}

$('basket-items').addEventListener('click', e => {
  const b = e.target.closest('button.chip');
  if (!b || !S.running || !LEVELS[S.level].undo) return;
  const id = b.dataset.id;
  if (S.basket[id] > 0) { S.basket[id]--; sfx.back(); renderBasket(); }
});

/* ---- 50品ながれきったとき ---- */
function openAsk(){
  pause();
  const bank = S.stage.type === 'bank';
  $('ask-title').textContent = bank ? `おかねが ${S.deck.length}まい ぜんぶ ながれたよ。` : `しなものが ${S.deck.length}こ ぜんぶ ながれたよ。`;
  $('ask-note').textContent = bank ? 'これで ひきだす？ それとも もういちど おかねを みる？' : 'これで レジへ いく？ それとも もういちど しなものを みる？';
  $('btn-ask-go').textContent = bank ? 'これで ひきだす' : 'これで レジへ いく';
  $('btn-ask-more').textContent = bank ? 'もういちど おかねを みる' : 'もういちど しなものを みる';
  $('ask').hidden = false;
  $('btn-ask-go').focus({preventScroll:true});
}
function askMore(){
  $('ask').hidden = true;
  const st = S.stage;
  S.pass++;
  track('deck_again', {level_name:S.level, place:st.place, pass:S.pass});
  S.deck = st.type === 'shop' ? buildDeck(st.pool, S.want, st.avoid, {}) : bankDeck();
  S.deckPos = 0; S.spawnIn = 300; S.prev = null;
  renderCount();
  resume();
}

/* ---- でんわ ---- */
function openCall(c){
  pause();
  S.call = c;
  $('call-where').textContent = c.where;
  $('call-ring').hidden = false; $('call-talk').hidden = true;
  $('call').hidden = false;
  $('handset').classList.add('buzz');
  startRing();
  $('btn-answer').focus({preventScroll:true});
}
function answerCall(){
  const c = S.call; if (!c) return;
  stopRing();
  $('handset').classList.remove('buzz');
  if (c.onAnswer) c.onAnswer();
  S.said.push(c.text);
  waitTimer(!!c.secs, $('call-timer'), $('call-timer-label'), $('call-timer-bar'));
  $('call-note').textContent = c.secs ? 'いいおわって じかんが くると、でんわは きれます。' : 'きると、もう みられません。';
  $('call-ring').hidden = true; $('call-talk').hidden = false;
  $('btn-hangup').focus({preventScroll:true});
  startClock();
  speak(c.text);
  typeText($('call-text'), c.text, () => whenVoiceDone(() => {
    if (c.secs) countdown(c.secs, $('call-timer'), $('call-timer-label'), $('call-timer-bar'), hangUp);
  }));
}
function hangUp(){
  const c = S.call; if (!c) return;
  stopCountdown(); stopType(); stopClock(); stopSpeak();
  S.call = null;
  $('call').hidden = true;
  c.after();
}
/* 買い物のとちゅうの電話（ふつう） */
function midCall(atRegister){
  const call = S.callsLeft.shift();
  openCall({
    where: atRegister ? 'レジに ならぼうとしたら…' : 'かいものの とちゅうで…',
    text: call.text, secs: 0,
    onAnswer(){ S.want = applyCall(S.want, call); },
    after: resume
  });
}
/* レジがおわったあとの電話（むずかしい） */
function nextCall(){
  const done = PLACES[S.stage.place], next = S.errand.stages[S.stageIdx + 1];
  openCall({
    where: `${done.n}は ぜんぶ あってた！ ほっと したら…`,
    text: next.speech, secs: LEVELS[S.level].timed ? next.secs : 0,
    after(){ S.stageIdx++; startStage(); }
  });
}

/* ---- レジ ---- */
function goRegister(){
  $('ask').hidden = true;
  if (S.callsLeft.length) { midCall(true); return; }
  finishStage();
}

function judgeStage(){
  const st = S.stage;
  if (st.type === 'bank') {
    const ok = S.total === st.amount;
    return {place:st.place, ok, count:0, reason: ok ? '' : (S.total < st.amount ? 'short' : 'over'),
            rows:[{label:'ひきだし', want:yen(st.amount), got:yen(S.total), ok}],
            why: ok ? '' : (S.total < st.amount ? `${yen(st.amount - S.total)} たりないよ。` : `${yen(S.total - st.amount)} おおいよ。`)};
  }
  const r = judge(S.want, S.basket);
  let why = '', reason = '';
  if (!r.ok) {
    const b = r.rows.find(x => !x.ok), it = ITEMS[b.id];
    reason = b.want === 0 ? 'extra' : b.got < b.want ? 'short' : 'over';
    why = b.want === 0 ? `${it.n}は たのんでないよ。`
        : b.got < b.want ? `${it.n}が ${b.want - b.got}${it.c} たりないよ。`
        : `${it.n}が ${b.got - b.want}${it.c} おおいよ。`;
  }
  return {place:st.place, ok:r.ok, why, reason,
          count:Object.values(S.basket).reduce((a, b) => a + b, 0),
          rows:r.rows.map(x => ({label:ITEMS[x.id].n, want:x.want + ITEMS[x.id].c, got:x.got + ITEMS[x.id].c, ok:x.ok}))};
}

function finishStage(){
  pause(); clearField();
  const res = judgeStage();
  S.log.push(res);
  if (res.ok && S.stageIdx < S.errand.stages.length - 1) { track('stage_clear', {level_name:S.level, place:res.place}); sfx.good(); nextCall(); return; }
  showResult(res);
}

function showResult(last){
  stop();
  const ok = last.ok;
  track('level_end', ok ? {level_name:S.level, success:true, stage_reached:S.log.length}
                        : {level_name:S.level, success:false, stage_reached:S.log.length, fail_place:last.place, fail_reason:last.reason});
  if (ok) { save.wins[S.level] = (save.wins[S.level] || 0) + 1; persist(); renderWins(); }

  const stamp = $('stamp');
  stamp.className = 'stamp ' + (ok ? 'good' : 'bad');
  stamp.innerHTML = ok ? 'おつかい<br>せいこう！' : '人の話を<br>よく聞いて！';
  $('mom-result').innerHTML = momSvg(ok ? 'happy' : 'angry', ok);
  $('result-says').classList.toggle('praise', ok);
  const hana = $('hanamaru'), streak = $('streak');
  hana.hidden = !ok; streak.hidden = !ok;
  if (ok) {
    hana.innerHTML = hanamaruSvg();
    streak.textContent = `${LEVELS[S.level].label} せいこう ${save.wins[S.level]}かいめ！`;
  }
  const lines = PRAISE[S.level];
  const msg = ok ? lines[Math.floor(Math.random() * lines.length)] : last.why;

  $('receipt-rows').innerHTML = S.log.map(g =>
    `<tr class="sec"><td colspan="4">― ${PLACES[g.place].n} ―</td></tr>` +
    g.rows.map(x =>
      `<tr class="${x.ok ? 'ok' : 'ng'}"><td>${x.label}</td><td>${x.want}</td><td>${x.got}</td>` +
      `<td class="mark" aria-label="${x.ok ? 'あってる' : 'ちがう'}">${x.ok ? '○' : '×'}</td></tr>`).join('')).join('');
  $('receipt-total').textContent = `${S.log.reduce((a, g) => a + g.count, 0)}てん`;
  const d = new Date(), p = n => String(n).padStart(2, '0');
  $('receipt-date').textContent = `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;

  const ol = $('said-list'); ol.textContent = '';
  S.said.forEach(t => { const li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });

  scr.result.scrollTop = 0;
  if (ok) {
    /* せいこう：画面いっぱいの ハッピーエンドで おわる（レシートは ボタンで みられる） */
    $('end-hanamaru').innerHTML = hanamaruSvg();
    $('end-streak').textContent = streak.textContent;
    $('result-text').textContent = msg;
    show('ending');
    scr.ending.scrollTop = 0;
    sfx.fanfare(); confetti();
    speak(msg); typeText($('end-text'), msg);
  } else {
    show('result');
    sfx.bad();
    speak(`人の話を、よく聞いて！ ${msg}`); typeText($('result-text'), msg);
  }
}

/* おかあさんと こどもが ならんで にっこり */
function endingSvg(){
  const ink = '#231f1c', skin = '#ffd9b8';
  const eye = (x, y) => `<path d="M${x} ${y}q3.6-5.6 7.2 0" fill="none" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/>`;

/* はなまる：うずまき＋花びらを ひとふでで かく */
function hanamaruSvg(){
  const pts = [], c = 60;
  for (let a = 0; a <= Math.PI * 5; a += 0.2) { const r = 3 + a * 1.75; pts.push([c + r * Math.cos(a), c + r * Math.sin(a)]); }
  for (let a = Math.PI; a <= Math.PI * 3.02; a += 0.08) { const r = 40 + 11 * Math.abs(Math.sin(a * 4)); pts.push([c + r * Math.cos(a), c + r * Math.sin(a)]); }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  return `<svg class="hanamaru" viewBox="0 0 120 120" role="img" aria-label="はなまる"><path pathLength="1" d="${d}"/></svg>`;
}

let confettiRaf = 0;
function stopConfetti(){
  cancelAnimationFrame(confettiRaf); confettiRaf = 0;
  const c = $('confetti'); if (c) c.hidden = true;
}
function confetti(){
  stopConfetti();
  if (reduced) return;
  const c = $('confetti'), ctx = c.getContext('2d');
  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = W * dpr; c.height = H * dpr; c.hidden = false;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const cols = ['--sale', '--basket', '--paper', '--answer', '--ink'].map(v => css.getPropertyValue(v).trim());
  const R = Math.random;
  const ps = Array.from({length:150}, () => ({
    x:R() * W, y:-20 - R() * H * 0.7, vx:(R() - 0.5) * 140, vy:170 + R() * 240,
    a:R() * 6.28, va:(R() - 0.5) * 12, w:8 + R() * 9, h:5 + R() * 6,
    col:cols[Math.floor(R() * cols.length)], round:R() < 0.25
  }));
  const t0 = performance.now(); let last = t0;
  const loop = ts => {
    const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; p.vx *= 0.995;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.h, 0, 6.28); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h * Math.abs(Math.cos(p.a * 1.7)) / 2, p.w, Math.max(1.5, p.h * Math.abs(Math.cos(p.a * 1.7))));
      ctx.restore();
    });
    if (ts - t0 < 6500) confettiRaf = requestAnimationFrame(loop); else stopConfetti();
  };
  confettiRaf = requestAnimationFrame(loop);
}
